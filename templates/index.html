<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能图像分析 (常博4441寓)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader { border-top-color: #3b82f6; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        /* 拖拽区域高亮样式 */
        .drop-zone-active {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans flex items-center justify-center min-h-screen">

    <div class="container mx-auto p-4 md:p-8 max-w-6xl">
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">

            <div class="p-6 md:p-8 bg-blue-600 text-white text-center">
                <h1 class="text-3xl md:text-4xl font-bold">智能量化分析平台 v2.0</h1>
                <p class="mt-2 text-blue-200">不仅识别物体，更能提供量化统计数据</p>
            </div>

                <div id="drop-zone" class="border-4 border-dashed border-gray-300 rounded-2xl p-8 text-center transition-all duration-300">
                    <label for="file-upload" class="cursor-pointer inline-block bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition-transform transform hover:scale-105">
                        选择文件 (图片/视频)
                    </label>
                    <input id="file-upload" type="file" class="hidden" accept="image/*,video/*">
                    <p class="mt-4 text-gray-500">或将文件拖拽至此</p>
                    <p class="text-sm text-gray-400 mt-1">也支持直接粘贴图片 (Ctrl+V)</p>
                    <p id="file-name" class="mt-4 text-sm text-gray-600 font-medium">尚未选择文件</p>

    <script>
        // --- DOM 元素获取 ---
        const fileUpload = document.getElementById('file-upload'); // 【修正】ID
        const fileNameDisplay = document.getElementById('file-name');
        const statusArea = document.getElementById('status-area');
        const statusText = document.getElementById('status-text');
        const loader = document.getElementById('loader');
        const resultArea = document.getElementById('result-area');
        const previewImage = document.getElementById('preview-image');
        const resultImage = document.getElementById('result-image');
        const analysisDataContainer = document.getElementById('analysis-data');
        const errorMessage = document.getElementById('error-message');
        const dropZone = document.getElementById('drop-zone');
        const exampleImagesContainer = document.getElementById('example-images');

        // (新) 获取视频元素
        const previewVideo = document.getElementById('preview-video');
        const resultVideo = document.getElementById('result-video');

        let pollingInterval;

        // 【核心函数】: 统一处理文件分析流程
        function startAnalysis(file) {
            // 【修正】同时接受图片和视频
            if (!file || (!file.type.startsWith('image/') && !file.type.startsWith('video/'))) {
                showError('请提供有效的图片或视频文件。');
                return;
            }

            resetUI();
            fileNameDisplay.textContent = file.name || '来自剪贴板或示例的文件';

            // (新) 根据文件类型显示不同的预览
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImage.src = e.target.result;
                    previewImage.classList.remove('hidden'); // 显示图片预览
                };
                reader.readAsDataURL(file);
            } else if (file.type.startsWith('video/')) {
                previewVideo.src = URL.createObjectURL(file);
                previewVideo.classList.remove('hidden'); // 显示视频预览
            }


            const formData = new FormData();
            formData.append('file', file);

            statusArea.classList.remove('hidden');
            statusText.textContent = '正在提交任务到后台队列...';

            fetch('/detect', { method: 'POST', body: formData })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => { throw new Error(err.error || `服务器错误: ${response.status}`) });
                    }
                    return response.json();
                })
                .then(data => {
                    statusText.textContent = '任务已提交！正在后台处理...';
                    loader.classList.remove('hidden');
                    pollTaskStatus(data.status_url);
                })
                .catch(err => {
                    showError(`提交任务失败: ${err.message}`);
                });
        }

        function pollTaskStatus(statusUrl) {
            pollingInterval = setInterval(() => {
                fetch(statusUrl)
                    .then(response => response.json())
                    .then(data => {
                        statusText.textContent = `任务状态: ${data.state}`;
                        if (data.state === 'SUCCESS') {
                            clearInterval(pollingInterval);
                            loader.classList.add('hidden');
                            statusText.textContent = '任务成功！正在加载分析报告...';
                            displayResult(data.result_url);
                        } else if (data.state === 'FAILURE') {
                            clearInterval(pollingInterval);
                            loader.classList.add('hidden');
                            showError(`任务处理失败: ${data.status}`);
                        }
                    })
                    .catch(err => {
                        clearInterval(pollingInterval);
                        showError(`轮询状态失败: ${err.message}`);
                    });
            }, 2000); // 轮询间隔保持2秒
        }

        // 【修正】显示结果 (图片或视频)
       function displayResult(resultUrl) {
    fetch(resultUrl)
        .then(response => response.json())
        .then(report => {
            console.log('收到分析报告:', report); // 添加调试信息

            if (report.is_video) {
                // --- 视频显示逻辑 ---
                console.log('处理视频结果，URL:', report.video_url);

                // 确保URL是完整的
                let videoUrl = report.video_url;
                if (!videoUrl.startsWith('http')) {
                    // 如果是相对路径，添加基础URL
                    videoUrl = window.location.origin + videoUrl;
                }

                console.log('完整视频URL:', videoUrl);

                // 设置视频源
                const source = resultVideo.querySelector('source');
                source.src = videoUrl;

                // 根据文件扩展名设置正确的MIME类型
                if (videoUrl.toLowerCase().endsWith('.avi')) {
                    source.type = 'video/x-msvideo';
                } else if (videoUrl.toLowerCase().endsWith('.mp4')) {
                    source.type = 'video/mp4';
                } else if (videoUrl.toLowerCase().endsWith('.webm')) {
                    source.type = 'video/webm';
                }

                // 重新加载视频
                resultVideo.load();

                // 添加事件监听来调试
                resultVideo.addEventListener('loadeddata', function() {
                    console.log('视频数据加载完成');
                    resultVideo.classList.remove('hidden');
                    resultVideo.play().catch(e => {
                        console.log('自动播放被阻止:', e);
                    });
                });

                resultVideo.addEventListener('error', function(e) {
                    console.error('视频加载错误:', e);
                    console.log('视频错误代码:', resultVideo.error?.code);
                    console.log('视频错误信息:', resultVideo.error?.message);
                    showError(`视频加载失败: ${resultVideo.error?.message || '未知错误'}`);
                });

                resultVideo.addEventListener('canplay', function() {
                    console.log('视频可以播放');
                });

            }  else {
    // --- 图片显示逻辑 ---
    console.log('处理图片结果，base64数据长度:', report.image_data?.length);

    // 检查base64数据是否存在
    if (!report.image_data) {
        console.error('错误: 分析报告中缺少image_data字段');
        showError('分析结果中缺少图片数据');
        return;
    }

    // 确保base64数据格式正确
    let base64Data = report.image_data;

    // 如果base64数据不包含data URL前缀，添加它
    if (!base64Data.startsWith('data:')) {
        base64Data = `data:image/jpeg;base64,${base64Data}`;
    }

    console.log('设置图片src，数据长度:', base64Data.length);

    // 使用Image对象预加载来检测图片是否有效
    const testImg = new Image();
    testImg.onload = function() {
        console.log('图片预加载成功');
        resultImage.src = base64Data;
        resultImage.classList.remove('hidden');

        // 重新触发动画
        resultImage.classList.remove('fade-in');
        void resultImage.offsetWidth; // 触发重排
        resultImage.classList.add('fade-in');
    };
    testImg.onerror = function() {
        console.error('图片预加载失败');
        console.log('base64数据前100字符:', base64Data.substring(0, 100));
        showError('结果图片数据格式错误，无法显示');
    };
    testImg.src = base64Data;
}
            // --- 统计数据逻辑 ---
            displayAnalysisData(report.analysis_data);

            statusArea.classList.add('hidden');
            resultArea.classList.remove('hidden');
        })
        .catch(err => {
            console.error('加载结果报告失败:', err);
            showError(`加载结果报告失败: ${err.message}`);
        });
}
function displayAnalysisData(data) {
    analysisDataContainer.innerHTML = '';

    const totalP = document.createElement('p');
    totalP.innerHTML = `<strong>总物体数:</strong> <span class="text-blue-600 font-bold">${data.total_objects}</span>`;
    analysisDataContainer.appendChild(totalP);

    if (data.class_counts && Object.keys(data.class_counts).length > 0) {
        const breakdownTitle = document.createElement('p');
        breakdownTitle.innerHTML = `<strong>类别明细:</strong>`;
        analysisDataContainer.appendChild(breakdownTitle);

        const ul = document.createElement('ul');
        ul.className = 'list-disc list-inside ml-4 text-gray-600';

        for (const [className, count] of Object.entries(data.class_counts)) {
            const li = document.createElement('li');
            li.textContent = `${className}: ${count} 个`;
            ul.appendChild(li);
        }
        analysisDataContainer.appendChild(ul);
    } else {
        const noDataMsg = document.createElement('p');
        noDataMsg.textContent = '未检测到具体类别信息。';
        noDataMsg.className = 'text-gray-500';
        analysisDataContainer.appendChild(noDataMsg);
    }
}

function checkVideoCompatibility() {
    const video = document.createElement('video');
    const formats = [
        { type: 'video/x-msvideo', name: 'AVI' },
        { type: 'video/mp4', name: 'MP4' },
        { type: 'video/webm', name: 'WebM' },
        { type: 'video/ogg', name: 'OGG' }
    ];

    console.log('浏览器视频格式支持检查:');
    formats.forEach(format => {
        const canPlay = video.canPlayType(format.type);
        console.log(`${format.name} (${format.type}): ${canPlay}`);
    });
}

        function resetUI() {
            if (pollingInterval) clearInterval(pollingInterval);

            // 清理视频预览
            previewVideo.src = '';
            previewVideo.classList.add('hidden');
            URL.revokeObjectURL(previewVideo.src); // 释放内存

            // 清理视频结果
            resultVideo.classList.add('hidden');
            resultVideo.querySelector('source').src = '';
            resultVideo.load();

            analysisDataContainer.innerHTML = '';
        }

        // --- 事件监听 ---

        // 1. 文件选择按钮 【修正】使用 fileUpload 变量
        fileUpload.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                startAnalysis(file);
            }
        });

        // 2. 拖拽区域
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
            }, false);
        });
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('drop-zone-active'), false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('drop-zone-active'), false);
        });
        dropZone.addEventListener('drop', (e) => {
            const file = e.dataTransfer.files[0];
            if (file) {
                startAnalysis(file); // 拖拽的文件直接调用startAnalysis
            }
        }, false);

        // 3. 粘贴事件 (仅支持图片)
        window.addEventListener('paste', e => {
            const file = e.clipboardData.files[0];
            if (file && file.type.startsWith('image/')) {
                startAnalysis(file);
            }
        });

        // 4. 示例图片点击事件 (仅支持图片)
        exampleImagesContainer.addEventListener('click', (e) => {
            if (e.target.tagName === 'IMG') {
                const imageUrl = e.target.src;
                fileNameDisplay.textContent = '正在加载示例图片...';
                // 将图片URL转换为File对象
                fetch(imageUrl)
                    .then(res => res.blob())
                    .then(blob => {
                        // 确定文件类型或给一个默认值
                        const fileType = blob.type || 'image/jpeg';
                        const fileName = `example_${Date.now()}.${fileType.split('/')[1] || 'jpg'}`;
                        const file = new File([blob], fileName, { type: fileType });
                        startAnalysis(file);
                    })
                    .catch(err => showError(`加载示例图片失败: ${err.message}`));
            }
        });

    </script>
</body>
</html>
