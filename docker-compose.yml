version: '3.8'

services:
  # 1. Redis: 任务调度中心与结果仓库
  redis:
    image: "redis:alpine"
    restart: unless-stopped
    command: redis-server --appendonly yes

  # 2. Web: 前台接待 (Flask应用)
  web:
    build: .
    command: gunicorn --bind 0.0.0.0:5000 web_app:app
    ports:
      - "5000:5000"
    # 【关键优化】将服务器上的代码目录挂载到容器内部
    # 这样修改代码后，只需重启容器，无需重新构建镜像
    volumes:
      - .:/app
    depends_on:
      - redis
    restart: unless-stopped

  # 3. Worker: 后台AI专家 (Celery应用)
  worker:
    build: .
    command: celery -A worker.celery_app worker --loglevel=info
    # 【关键优化】同样挂载代码目录
    volumes:
      - .:/app
    depends_on:
      - redis
    restart: unless-stopped

