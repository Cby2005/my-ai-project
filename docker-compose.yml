version: '3.8'

# 1. 在顶层定义两个卷
volumes:
  uploads_volume:
  results_volume:

services:
  # ... (您的 redis 服务不变) ...

  # 2. Web: 前台接待 (Flask应用)
  web:
    build: .
    command: gunicorn --bind 0.0.0.0:5000 web_app:app
    ports:
      - "5000:5000"
    depends_on:
      - redis
    restart: unless-stopped
    # 3. 挂载卷到 web 服务
    volumes:
      - uploads_volume:/app/uploads
      - results_volume:/app/static/results

  # 4. Worker: 后台AI专家 (Celery应用)
  worker:
    build: .
    command: celery -A worker.celery_app worker --loglevel=info
    depends_on:
      - redis
    restart: unless-stopped
    # 5. 挂载同样的卷到 worker 服务
    volumes:
      - uploads_volume:/app/uploads
      - results_volume:/app/static/results