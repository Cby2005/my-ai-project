version: '3.8'

volumes:
  uploads_volume:
  results_volume:

services:
  redis:
    image: "redis:alpine"
    restart: unless-stopped
    command: redis-server --appendonly yes

    # docker-compose.yml (web service)
  web:
    build: .
      # (修改) 增加 --timeout 300
    command: gunicorn --bind 0.0.0.0:5000 --timeout 300 web_app:app
      # ... 其他配置
    ports:
      - "5000:5000"
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - uploads_volume:/app/uploads
      - results_volume:/app/static/results
    # (新) 从 .env 文件加载 API 密钥
    env_file:
      - .env

  worker:
    build: .
    command: celery -A worker.celery_app worker --loglevel=info
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - uploads_volume:/app/uploads
      - results_volume:/app/static/results
    # (新) 从 .env 文件加载 API 密钥
    env_file:
      - .env